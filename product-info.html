<!DOCTYPE html>
<html lang="es">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>eMercado - Todo lo que busques está aquí</title>

    <link href="https://fonts.googleapis.com/css?family=Raleway:300,300i,400,400i,700,700i,900,900i" rel="stylesheet" />
    <link href="css/font-awesome.min.css" rel="stylesheet" />
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
</head>

<body>
        <!-- Header + Hero -->
    <header class="bg-light">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light" style="background-color:#f8f9fa;">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="/img/japLogo.png " href="index.html" alt="Logo JAP" width="80" class="me-2">
                    <span class="fw-bold text-dark">e-Mercado</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav mb-2 mb-lg-0 align-items-lg-center">
                        <li>
                            <a href="index.html" class="nav-item ms-lg-3 nav-orange">Inicio</a>
                        </li>
                        <li>
                            <a href="categories.html" class="nav-item ms-lg-3 nav-orange">Ver Categorías</a>
                        </li>
                        <li>
                            <a href="sell.html" class="nav-item ms-lg-3 nav-orange">Vender ahora</a>
                        </li>
                        <li class="nav-item ms-lg-3" id="userNav">
                            <a id="btnLogin" class="btn" href="login.html"
                                style="background-color:#ff6b00; color:white;">Iniciar sesión</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <main class="my-4">
            </div>

            <div class="category-header">
                <button id="back-to-category" class="btn">
                    <span class="d-none d-sm-inline"><i class="fas fa-angle-left"></i> Volver</span>
                    <span class="d-inline d-sm-none"><i class="fas fa-angle-left"></i></span>
                </button>
                <p id="product-category" class="mb-0"></p>
            </div>

            <h1 id="product-name" class="mb-3 ms-5 fw-bold"></h1>
            <div class="carousel-container">
                <div id="product-images" class="carousel slide mb-4" data-bs-ride="carousel">
                    <div class="carousel-inner" id="carousel-inner">
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#product-images"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Anterior</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#product-images"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Siguiente</span>
                    </button>
                </div>
                <div class="row mt-3 justify-content-center" id="carousel-thumbs">
                </div>
                <div class="text-end mt-2" style="width:100%;">
                    <p id="product-sold" class="mb-0 ms-5"></p>
                </div>
            </div>
            <div id="product-description" class="mb-5 ms-5">
            </div>
            </div>
        </main>
        <footer class="text-muted">
            <div class="container">
                <p class="float-end">
                    <a href="#">Volver arriba</a>
                </p>
                <p>
                    Este sitio forma parte de
                    <a href="https://jovenesaprogramar.edu.uy/" target="_blank">Jovenes a Programar</a>
                </p>
            </div>
        </footer>
        <div id="spinner-wrapper">
            <div class="lds-ring">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="js/init.js"></script>
        <script src="js/product-info.js"></script>
        <script src="js/mostrarUsuarioLogueado.js"></script>
        <script src="js/proteccion.js"></script>

</html>
